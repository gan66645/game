<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连连看 - 清宫国风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;background:#0d0d1a;
  font-family:"Noto Serif SC","SimSun","STSong",serif;
  user-select:none;overflow-y:auto;
}
body::before{
  content:"";position:fixed;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(180,130,60,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 70%,rgba(140,30,40,0.05) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}
.game-wrapper{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:14px;padding:20px;
}
.title{
  font-size:36px;color:#d4a853;
  letter-spacing:12px;font-weight:400;
  text-shadow:0 2px 20px rgba(212,168,83,0.3);
}
.info-bar{
  display:flex;gap:24px;color:#b0a890;
  font-size:14px;align-items:center;flex-wrap:wrap;justify-content:center;
}
.info-bar .label{color:#7a7060;font-size:12px;display:block}
.info-bar strong{color:#d4a853;font-size:18px;font-weight:400}
canvas{
  border:3px solid #3a2a1a;
  border-radius:6px;
  background:#0f0d08;
  box-shadow:0 0 30px rgba(180,130,60,0.12),inset 0 0 60px rgba(0,0,0,0.4);
}
.controls{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.controls button{
  padding:10px 22px;
  border:1px solid #4a3820;border-radius:4px;
  background:linear-gradient(180deg,#1a150e,#110e08);
  color:#c0b080;font-size:14px;cursor:pointer;
  font-family:inherit;letter-spacing:2px;
  transition:all 0.15s;
}
.controls button:hover{background:linear-gradient(180deg,#2a2218,#1a150e);border-color:#8a6830;color:#e0c888}
.controls button:active{transform:scale(0.97)}
.controls button:disabled{opacity:0.35;cursor:default;border-color:#3a2a18}
.overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(5,5,15,0.85);
  display:flex;justify-content:center;align-items:center;
  z-index:10;flex-direction:column;gap:20px;
}
.overlay.hidden{display:none}
.overlay h2{font-size:32px;color:#d4a853;font-weight:400;letter-spacing:6px}
.overlay p{color:#b0a890;font-size:16px}
.overlay button{
  padding:12px 32px;
  border:1px solid #8a6830;border-radius:4px;
  background:linear-gradient(180deg,#2a2010,#1a1408);
  color:#e0c888;font-size:16px;cursor:pointer;
  font-family:inherit;letter-spacing:4px;
  transition:all 0.15s;
}
.overlay button:hover{background:linear-gradient(180deg,#3a2c14,#2a2010)}
@media(max-width:800px){
  .title{font-size:26px;letter-spacing:8px}
  .info-bar{gap:12px;font-size:12px}
  .info-bar strong{font-size:15px}
  .controls button{padding:8px 16px;font-size:12px;letter-spacing:1px}
}
</style>
</head>
<body>
<div class="game-wrapper">
  <h1 class="title">连连看</h1>
  <div class="info-bar">
    <div><span class="label">难度</span><strong id="diffLabel">简单</strong></div>
    <div><span class="label">得分</span><strong id="score">0</strong></div>
    <div><span class="label">剩余</span><strong id="pairsLeft">24</strong>对</div>
    <div><span class="label">用时</span><strong id="timer">00:00</strong></div>
  </div>
  <canvas id="game"></canvas>
  <div class="controls">
    <button id="btnHint">提示 (<span id="hintCount">3</span>)</button>
    <button id="btnShuffle">洗牌</button>
    <button id="btnRestart">重新开始</button>
  </div>
</div>
<div class="overlay hidden" id="overlay">
  <h2 id="overlayTitle"></h2>
  <p id="overlayMsg"></p>
  <button id="overlayBtn"></button>
</div>
<script>
// ============================================================
// CONSTANTS
// ============================================================
var DIFFICULTIES = {
  easy:   { rows:6, cols:8,  name:"\u7b80\u5355", types:12, perType:4 },
  medium: { rows:8, cols:10, name:"\u4e2d\u7b49", types:16, perType:5 },
  hard:   { rows:10,cols:12, name:"\u56f0\u96be", types:20, perType:6 }
};

var TILE_BG = [
  "#8B1A2B","#9A6B14","#1B3A5C","#1A5C3A","#5C2D0E",
  "#3D1A4A","#1A3A2A","#7A5C10","#4A154A","#6B3A1A",
  "#1A3A4A","#5A1A4A","#2A5A1A","#7A2A1A","#1A2A5A",
  "#6A3A0A","#1A4A3A","#8A1A1A","#1A1A5A","#4A2A1A"
];

var boardState = { grid:[], rows:0, cols:0, tilesLeft:0, pairsLeft:0 };
var uiState = { difficulty:"easy", score:0, hintsLeft:3 };
var timerSec = 0, timerRunning = false, timerInterval = null;
var selectedTile = null;
var connectionPath = null;
var TILE_SIZE = 50, GAP = 3, BOARD_X = 0, BOARD_Y = 0;

// ============================================================
// PATTERN DRAWING FUNCTIONS (20 patterns)
// ============================================================
function drawPattern(ctx, id, cx, cy, s) {
  var h = s / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = "#ffe8c0";
  ctx.fillStyle = "#ffe8c0";
  ctx.lineWidth = Math.max(1.2, s * 0.04);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  switch (id) {
    case 1:
      ctx.beginPath(); ctx.arc(0, 0, h * 0.85, 0, Math.PI * 2); ctx.stroke();
      var ih = h * 0.32;
      ctx.beginPath(); ctx.rect(-ih, -ih, ih * 2, ih * 2); ctx.stroke();
      break;
    case 2:
      ctx.beginPath();
      ctx.moveTo(0, h * 0.9);
      ctx.quadraticCurveTo(h * 0.3, h * 0.2, h * 0.7, -h * 0.1);
      ctx.quadraticCurveTo(h * 0.9, -h * 0.35, h * 0.5, -h * 0.5);
      ctx.quadraticCurveTo(h * 0.1, -h * 0.65, -h * 0.1, -h * 0.3);
      ctx.quadraticCurveTo(-h * 0.35, h * 0.05, 0, h * 0.35);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(-h * 0.35, -h * 0.05, h * 0.2, 0, Math.PI * 2); ctx.stroke();
      break;
    case 3:
      ctx.beginPath();
      for (var i = 0; i <= 5; i++) {
        var a = -Math.PI * 0.7 + i * Math.PI * 0.28;
        var ex = Math.cos(a) * h * 0.8, ey = Math.sin(a) * h * 0.8;
        if (i === 0) ctx.moveTo(0, h * 0.9);
        else ctx.lineTo(ex, -ey);
      }
      ctx.lineTo(0, h * 0.9);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, h * 0.9, h * 0.8, -Math.PI * 0.7, -Math.PI * 0.7 + Math.PI * 1.4); ctx.stroke();
      break;
    case 4:
      ctx.beginPath(); ctx.ellipse(0, 0, h * 0.45, h * 0.6, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h * 0.5, -h * 0.6); ctx.lineTo(h * 0.5, -h * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h * 0.5, h * 0.6); ctx.lineTo(h * 0.5, h * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -h * 0.8); ctx.lineTo(0, -h * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, h * 0.6); ctx.lineTo(0, h * 0.9); ctx.stroke();
      for (var y = -h * 0.3; y <= h * 0.3; y += h * 0.2) {
        ctx.beginPath(); ctx.moveTo(-h * 0.3, y); ctx.lineTo(h * 0.3, y); ctx.stroke();
      }
      break;
    case 5:
      ctx.beginPath(); ctx.arc(0, -h * 0.25, h * 0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, h * 0.35, h * 0.45, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -h * 0.8); ctx.lineTo(0, -h * 0.55); ctx.stroke();
      break;
    case 6:
      ctx.beginPath();
      ctx.moveTo(-h * 0.7, h * 0.2);
      ctx.quadraticCurveTo(-h * 0.6, -h * 0.3, -h * 0.3, -h * 0.3);
      ctx.lineTo(h * 0.3, -h * 0.3);
      ctx.quadraticCurveTo(h * 0.6, -h * 0.3, h * 0.7, h * 0.2);
      ctx.quadraticCurveTo(h * 0.85, h * 0.5, 0, h * 0.8);
      ctx.quadraticCurveTo(-h * 0.85, h * 0.5, -h * 0.7, h * 0.2);
      ctx.stroke();
      break;
    case 7:
      ctx.beginPath();
      ctx.moveTo(-h * 0.2, -h * 0.8);
      ctx.lineTo(h * 0.2, -h * 0.8);
      ctx.quadraticCurveTo(h * 0.35, -h * 0.4, h * 0.55, -h * 0.15);
      ctx.quadraticCurveTo(h * 0.7, h * 0.3, h * 0.5, h * 0.5);
      ctx.lineTo(-h * 0.5, h * 0.5);
      ctx.quadraticCurveTo(-h * 0.7, h * 0.3, -h * 0.55, -h * 0.15);
      ctx.quadraticCurveTo(-h * 0.35, -h * 0.4, -h * 0.2, -h * 0.8);
      ctx.stroke();
      break;
    case 8:
      for (var i = 0; i < 6; i++) {
        var a = i * Math.PI / 3;
        var px = Math.cos(a) * h * 0.35, py = Math.sin(a) * h * 0.35;
        ctx.beginPath();
        ctx.arc(px, py, h * 0.28, -a + Math.PI * 0.7, -a + Math.PI * 1.3);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, h * 0.18, 0, Math.PI * 2); ctx.fill();
      break;
    case 9:
      for (var i = 0; i < 5; i++) {
        var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        var px = Math.cos(a) * h * 0.45, py = Math.sin(a) * h * 0.45;
        ctx.beginPath(); ctx.arc(px, py, h * 0.25, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, h * 0.1, 0, Math.PI * 2); ctx.fill();
      break;
    case 10:
      for (var i = 0; i < 5; i++) {
        var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        var px = Math.cos(a) * h * 0.3, py = Math.sin(a) * h * 0.3;
        ctx.beginPath(); ctx.ellipse(px, py, h * 0.15, h * 0.4, a, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, h * 0.12, 0, Math.PI * 2); ctx.fill();
      break;
    case 11:
      ctx.beginPath();
      ctx.moveTo(0, h * 0.6);
      ctx.quadraticCurveTo(h * 0.15, -h * 0.1, h * 0.75, -h * 0.1);
      ctx.quadraticCurveTo(h * 0.35, h * 0.0, h * 0.25, -h * 0.25);
      ctx.lineTo(0.05, -h * 0.05);
      ctx.lineTo(-0.05, -h * 0.05);
      ctx.lineTo(-h * 0.25, -h * 0.25);
      ctx.quadraticCurveTo(-h * 0.35, h * 0.0, -h * 0.75, -h * 0.1);
      ctx.quadraticCurveTo(-h * 0.15, -h * 0.1, 0, h * 0.6);
      ctx.stroke();
      break;
    case 12:
      ctx.beginPath();
      ctx.ellipse(h * 0.3, -h * 0.1, h * 0.35, h * 0.5, -0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-h * 0.3, -h * 0.1, h * 0.35, h * 0.5, 0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(h * 0.25, h * 0.35, h * 0.22, h * 0.3, 0.2, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-h * 0.25, h * 0.35, h * 0.22, h * 0.3, -0.2, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -h * 0.5); ctx.lineTo(0, h * 0.2); ctx.stroke();
      break;
    case 13:
      ctx.beginPath();
      ctx.moveTo(h * 0.7, 0);
      ctx.quadraticCurveTo(h * 0.3, -h * 0.6, -h * 0.4, -h * 0.3);
      ctx.lineTo(-h * 0.8, -h * 0.5);
      ctx.lineTo(-h * 0.5, 0);
      ctx.lineTo(-h * 0.8, h * 0.5);
      ctx.lineTo(-h * 0.4, h * 0.3);
      ctx.quadraticCurveTo(h * 0.3, h * 0.6, h * 0.7, 0);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(h * 0.25, -h * 0.1, h * 0.1, 0, Math.PI * 2); ctx.fill();
      break;
    case 14:
      ctx.beginPath();
      ctx.arc(-h * 0.25, h * 0.15, h * 0.3, Math.PI * 0.4, Math.PI * 1.3); ctx.stroke();
      ctx.beginPath();
      ctx.arc(h * 0.15, -h * 0.1, h * 0.25, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath();
      ctx.arc(h * 0.35, h * 0.2, h * 0.22, Math.PI * 1.4, Math.PI * 2.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h * 0.35, -h * 0.2); ctx.lineTo(h * 0.55, h * 0.35); ctx.stroke();
      break;
    case 15:
      ctx.save();
      ctx.translate(0, 0);
      ctx.rotate(Math.PI / 4);
      ctx.strokeRect(-h * 0.4, -h * 0.4, h * 0.8, h * 0.8);
      ctx.rotate(-Math.PI / 2);
      ctx.strokeRect(-h * 0.4, -h * 0.4, h * 0.8, h * 0.8);
      ctx.restore();
      break;
    case 16:
      var k = h * 0.35;
      ctx.beginPath();
      ctx.moveTo(-k, k); ctx.lineTo(-k, -k); ctx.lineTo(k, -k); ctx.lineTo(k, k);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-k * 0.6, k * 0.6); ctx.lineTo(-k * 0.6, -k * 0.6); ctx.lineTo(k * 0.6, -k * 0.6); ctx.lineTo(k * 0.6, k * 0.6);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-k, 0); ctx.lineTo(k, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -k); ctx.lineTo(0, k); ctx.stroke();
      break;
    case 17:
      ctx.beginPath();
      ctx.moveTo(0, h * 0.2);
      ctx.bezierCurveTo(-h * 0.6, -h * 0.1, -h * 0.5, -h * 0.65, 0, -h * 0.6);
      ctx.bezierCurveTo(h * 0.5, -h * 0.65, h * 0.6, -h * 0.1, 0, h * 0.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.3);
      ctx.quadraticCurveTo(-h * 0.25, -h * 0.15, -h * 0.15, h * 0.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.3);
      ctx.quadraticCurveTo(h * 0.25, -h * 0.15, h * 0.15, h * 0.05);
      ctx.stroke();
      break;
    case 18:
      ctx.font = (s * 0.8) + "px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("\u798F", 0, s * 0.04);
      break;
    case 19:
      ctx.font = (s * 0.8) + "px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("\u7984", 0, s * 0.04);
      break;
    case 20:
      ctx.font = (s * 0.8) + "px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("\u5BFF", 0, s * 0.04);
      break;
  }
  ctx.restore();
}

// ============================================================
// BOARD OPERATIONS
// ============================================================
function generateBoard(diffKey) {
  var d = DIFFICULTIES[diffKey];
  var rows = d.rows + 2;
  var cols = d.cols + 2;
  boardState.rows = d.rows;
  boardState.cols = d.cols;

  var pool = [];
  for (var t = 1; t <= d.types; t++) {
    for (var i = 0; i < d.perType; i++) {
      pool.push(t);
    }
  }

  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  var grid = [];
  for (var r = 0; r < rows; r++) {
    grid[r] = [];
    for (var c = 0; c < cols; c++) {
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
        grid[r][c] = 0;
      }
    }
  }

  var idx = 0;
  for (var r = 1; r <= d.rows; r++) {
    for (var c = 1; c <= d.cols; c++) {
      grid[r][c] = pool[idx++];
    }
  }

  boardState.grid = grid;
  boardState.tilesLeft = pool.length;
  boardState.pairsLeft = pool.length / 2;
}

// ============================================================
// CONNECTION ALGORITHM
// ============================================================
function isLineClear(grid, r1, c1, r2, c2) {
  if (r1 === r2) {
    var minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
    for (var c = minC + 1; c < maxC; c++) {
      if (grid[r1][c] !== 0) return false;
    }
    return true;
  }
  if (c1 === c2) {
    var minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
    for (var r = minR + 1; r < maxR; r++) {
      if (grid[r][c1] !== 0) return false;
    }
    return true;
  }
  return false;
}

function canConnect(grid, r1, c1, r2, c2) {
  if (r1 === r2 && c1 === c2) return null;
  if (grid[r1][c1] !== grid[r2][c2]) return null;
  if (grid[r1][c1] === 0) return null;

  if ((r1 === r2 || c1 === c2) && isLineClear(grid, r1, c1, r2, c2)) {
    return { turns: 0, path: [[r1, c1], [r2, c2]] };
  }

  if (grid[r1][c2] === 0 && isLineClear(grid, r1, c1, r1, c2) && isLineClear(grid, r1, c2, r2, c2)) {
    return { turns: 1, path: [[r1, c1], [r1, c2], [r2, c2]] };
  }
  if (grid[r2][c1] === 0 && isLineClear(grid, r1, c1, r2, c1) && isLineClear(grid, r2, c1, r2, c2)) {
    return { turns: 1, path: [[r1, c1], [r2, c1], [r2, c2]] };
  }

  for (var r = 0; r < grid.length; r++) {
    if (grid[r][c1] === 0 && grid[r][c2] === 0 &&
        isLineClear(grid, r1, c1, r, c1) &&
        isLineClear(grid, r, c1, r, c2) &&
        isLineClear(grid, r, c2, r2, c2)) {
      return { turns: 2, path: [[r1, c1], [r, c1], [r, c2], [r2, c2]] };
    }
  }

  for (var c = 0; c < grid[0].length; c++) {
    if (grid[r1][c] === 0 && grid[r2][c] === 0 &&
        isLineClear(grid, r1, c1, r1, c) &&
        isLineClear(grid, r1, c, r2, c) &&
        isLineClear(grid, r2, c, r2, c2)) {
      return { turns: 2, path: [[r1, c1], [r1, c], [r2, c], [r2, c2]] };
    }
  }

  return null;
}

function findAnyMatch(grid) {
  var byType = {};
  for (var r = 1; r <= boardState.rows; r++) {
    for (var c = 1; c <= boardState.cols; c++) {
      var t = grid[r][c];
      if (t === 0) continue;
      if (!byType[t]) byType[t] = [];
      byType[t].push([r, c]);
    }
  }

  for (var type in byType) {
    var positions = byType[type];
    for (var i = 0; i < positions.length; i++) {
      for (var j = i + 1; j < positions.length; j++) {
        var r1 = positions[i][0], c1 = positions[i][1];
        var r2 = positions[j][0], c2 = positions[j][1];
        var result = canConnect(grid, r1, c1, r2, c2);
        if (result) return { r1: r1, c1: c1, r2: r2, c2: c2, path: result.path, turns: result.turns };
      }
    }
  }
  return null;
}

function shuffleBoard() {
  var grid = boardState.grid;
  var tiles = [];
  for (var r = 1; r <= boardState.rows; r++) {
    for (var c = 1; c <= boardState.cols; c++) {
      if (grid[r][c] !== 0) {
        tiles.push(grid[r][c]);
      }
    }
  }

  var attempts = 0;
  do {
    for (var i = tiles.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = tiles[i]; tiles[i] = tiles[j]; tiles[j] = tmp;
    }
    var idx = 0;
    for (var r = 1; r <= boardState.rows; r++) {
      for (var c = 1; c <= boardState.cols; c++) {
        if (grid[r][c] !== 0) {
          grid[r][c] = tiles[idx++];
        }
      }
    }
    attempts++;
    if (attempts > 1000) break;
  } while (!findAnyMatch(grid));
}

// ============================================================
// RENDERING
// ============================================================
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

function computeLayout() {
  var maxW = Math.min(750, window.innerWidth - 32);
  var borderCols = boardState.cols + 2;
  var borderRows = boardState.rows + 2;

  TILE_SIZE = Math.floor((maxW - 12) / borderCols);
  GAP = Math.max(2, Math.floor(TILE_SIZE * 0.06));
  var totalW = borderCols * (TILE_SIZE + GAP) + GAP;
  var totalH = borderRows * (TILE_SIZE + GAP) + GAP;

  canvas.width = totalW;
  canvas.height = totalH;
  BOARD_X = GAP;
  BOARD_Y = GAP;
}

function tileRect(gridR, gridC) {
  var x = BOARD_X + gridC * (TILE_SIZE + GAP);
  var y = BOARD_Y + gridR * (TILE_SIZE + GAP);
  return { x: x, y: y, w: TILE_SIZE, h: TILE_SIZE };
}

function gridPosFromPixel(px, py) {
  var gc = Math.round((px - BOARD_X - GAP / 2) / (TILE_SIZE + GAP));
  var gr = Math.round((py - BOARD_Y - GAP / 2) / (TILE_SIZE + GAP));
  if (gr >= 1 && gr <= boardState.rows && gc >= 1 && gc <= boardState.cols) {
    var rect = tileRect(gr, gc);
    if (px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h) {
      return [gr, gc];
    }
  }
  return null;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawTile(gridR, gridC, tileType) {
  var rect = tileRect(gridR, gridC);
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  var bg = TILE_BG[(tileType - 1) % TILE_BG.length];

  ctx.fillStyle = "rgba(0,0,0,0.4)";
  roundRect(x + 2, y + 2, w, h, 4);
  ctx.fill();

  ctx.fillStyle = bg;
  roundRect(x, y, w, h, 4);
  ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  roundRect(x + 2, y + 2, w - 4, h - 4, 3);
  ctx.stroke();

  var patSize = Math.min(w, h) * 0.55;
  drawPattern(ctx, tileType, x + w / 2, y + h / 2, patSize);
}

function drawSelection(gridR, gridC) {
  var rect = tileRect(gridR, gridC);
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  ctx.strokeStyle = "#d4a853";
  ctx.lineWidth = 3;
  ctx.shadowColor = "rgba(212,168,83,0.6)";
  ctx.shadowBlur = 12;
  roundRect(x - 1, y - 1, w + 2, h + 2, 5);
  ctx.stroke();
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
}

function drawConnectionPath(path) {
  if (!path || path.length < 2) return;

  var points = [];
  for (var i = 0; i < path.length; i++) {
    var rect = tileRect(path[i][0], path[i][1]);
    points.push({ x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 });
  }

  ctx.strokeStyle = "#ffd700";
  ctx.lineWidth = 3;
  ctx.shadowColor = "rgba(255,215,0,0.7)";
  ctx.shadowBlur = 10;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (var i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.stroke();
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var r = 1; r <= boardState.rows; r++) {
    for (var c = 1; c <= boardState.cols; c++) {
      var t = boardState.grid[r][c];
      if (t === 0) continue;
      drawTile(r, c, t);
    }
  }

  if (connectionPath) {
    drawConnectionPath(connectionPath);
  }

  if (selectedTile) {
    drawSelection(selectedTile[0], selectedTile[1]);
  }
}

// ============================================================
// GAME LOGIC
// ============================================================
function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerSec = 0;
  timerInterval = setInterval(function() {
    timerSec++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  timerRunning = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  var m = Math.floor(timerSec / 60).toString().padStart(2, "0");
  var s = (timerSec % 60).toString().padStart(2, "0");
  document.getElementById("timer").textContent = m + ":" + s;
}

function updateUI() {
  document.getElementById("score").textContent = uiState.score;
  document.getElementById("pairsLeft").textContent = boardState.pairsLeft;
  document.getElementById("hintCount").textContent = uiState.hintsLeft;
  document.getElementById("diffLabel").textContent = DIFFICULTIES[uiState.difficulty].name;
  document.getElementById("btnHint").innerHTML = "\u63d0\u793a (" + uiState.hintsLeft + ")";
  document.getElementById("btnHint").disabled = uiState.hintsLeft <= 0;
}

function onMatch(r1, c1, r2, c2, result) {
  connectionPath = result.path;
  render();

  setTimeout(function() {
    connectionPath = null;
    boardState.grid[r1][c1] = 0;
    boardState.grid[r2][c2] = 0;
    boardState.tilesLeft -= 2;
    boardState.pairsLeft--;
    selectedTile = null;

    var speedBonus = Math.max(0, 50 - timerSec);
    uiState.score += 100 + speedBonus;

    updateUI();
    render();

    if (boardState.pairsLeft === 0) {
      stopTimer();
      if (uiState.difficulty === "hard") {
        showOverlay("\u606d\u559c\u901a\u5173\uff01", "\u603b\u7528\u65f6 " + formatTime(timerSec) + "\uff0c\u603b\u5206 " + uiState.score, "\u518d\u73a9\u4e00\u6b21", restartGame);
      } else {
        var next = uiState.difficulty === "easy" ? "medium" : "hard";
        showOverlay("\u5173\u5361\u901a\u8fc7\uff01",
          "\u7528\u65f6 " + formatTime(timerSec) + "\uff0c\u5f97\u5206 " + uiState.score,
          "\u8fdb\u5165" + DIFFICULTIES[next].name,
          function() { hideOverlay(); startLevel(next); });
      }
      return;
    }

    if (!findAnyMatch(boardState.grid)) {
      shuffleBoard();
      updateUI();
      render();
    }
  }, 250);
}

function handleTileClick(gridR, gridC) {
  if (connectionPath) return;
  if (boardState.grid[gridR][gridC] === 0) return;

  if (!timerRunning) startTimer();

  if (selectedTile === null) {
    selectedTile = [gridR, gridC];
    render();
    return;
  }

  var sr = selectedTile[0], sc = selectedTile[1];
  if (sr === gridR && sc === gridC) {
    selectedTile = null;
    render();
    return;
  }

  var result = canConnect(boardState.grid, sr, sc, gridR, gridC);
  if (result) {
    onMatch(sr, sc, gridR, gridC, result);
  } else if (boardState.grid[sr][sc] === boardState.grid[gridR][gridC]) {
    connectionPath = null;
    render();
    setTimeout(function() {
      selectedTile = null;
      render();
    }, 200);
  } else {
    selectedTile = [gridR, gridC];
    render();
  }
}

function doHint() {
  if (uiState.hintsLeft <= 0 || connectionPath) return;
  var match = findAnyMatch(boardState.grid);
  if (!match) return;

  uiState.hintsLeft--;
  updateUI();

  var flashCount = 0;
  var maxFlashes = 6;
  var flashInterval = setInterval(function() {
    if (flashCount >= maxFlashes) {
      clearInterval(flashInterval);
      connectionPath = null;
      render();
      return;
    }
    if (flashCount % 2 === 0) {
      connectionPath = match.path;
    } else {
      connectionPath = null;
    }
    render();
    flashCount++;
  }, 180);
}

function doShuffle() {
  if (connectionPath || boardState.tilesLeft === 0) return;
  selectedTile = null;
  shuffleBoard();
  updateUI();
  render();
}

function startLevel(diffKey) {
  stopTimer();
  timerSec = 0;
  uiState.difficulty = diffKey;
  uiState.score = 0;
  uiState.hintsLeft = 3;
  selectedTile = null;
  connectionPath = null;

  generateBoard(diffKey);
  computeLayout();

  if (!findAnyMatch(boardState.grid)) {
    shuffleBoard();
  }

  updateTimerDisplay();
  updateUI();
  render();
}

function restartGame() {
  hideOverlay();
  startLevel("easy");
}

function formatTime(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m > 0 ? m + "\u5206" + s + "\u79d2" : s + "\u79d2";
}

function showOverlay(title, msg, btnText, btnAction) {
  document.getElementById("overlayTitle").textContent = title;
  document.getElementById("overlayMsg").textContent = msg;
  document.getElementById("overlayBtn").textContent = btnText;
  document.getElementById("overlayBtn").onclick = btnAction;
  document.getElementById("overlay").classList.remove("hidden");
}

function hideOverlay() {
  document.getElementById("overlay").classList.add("hidden");
}

// ============================================================
// EVENT HANDLERS
// ============================================================
canvas.addEventListener("click", function(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var px = (e.clientX - rect.left) * scaleX;
  var py = (e.clientY - rect.top) * scaleY;
  var pos = gridPosFromPixel(px, py);
  if (pos) handleTileClick(pos[0], pos[1]);
});

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var touch = e.touches[0];
  var px = (touch.clientX - rect.left) * scaleX;
  var py = (touch.clientY - rect.top) * scaleY;
  var pos = gridPosFromPixel(px, py);
  if (pos) handleTileClick(pos[0], pos[1]);
});

document.getElementById("btnHint").addEventListener("click", doHint);
document.getElementById("btnShuffle").addEventListener("click", doShuffle);
document.getElementById("btnRestart").addEventListener("click", function() {
  stopTimer();
  restartGame();
});

window.addEventListener("resize", function() {
  computeLayout();
  render();
});

// ============================================================
// INIT
// ============================================================
startLevel("easy");
</script>
