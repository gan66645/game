<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #1a1a2e;
  font-family: "Segoe UI", system-ui, sans-serif;
  user-select: none;
}
.game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 440px;
  padding: 0 4px;
}
.score-panel {
  display: flex;
  gap: 24px;
  color: #e0e0e0;
  font-size: 15px;
}
.score-panel span { color: #7f8c8d; }
.score-panel strong { color: #00d2a0; font-weight: 600; font-size: 22px; }
canvas {
  border: 2px solid #2d2d5e;
  border-radius: 8px;
  background: #0f0f23;
  box-shadow: 0 0 40px rgba(0, 210, 160, 0.15);
}
.controls {
  display: flex;
  gap: 8px;
}
.controls button {
  padding: 10px 24px;
  border: 1px solid #3a3a6e;
  border-radius: 6px;
  background: #1e1e3a;
  color: #c0c0d0;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.controls button:hover { background: #2a2a50; border-color: #00d2a0; color: #fff; }
.controls button:active { transform: scale(0.97); }
.mobile-pad {
  display: none;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(3, 56px);
  gap: 6px;
  margin-top: 8px;
}
.mobile-pad button {
  width: 56px; height: 56px;
  border: 1px solid #3a3a6e;
  border-radius: 10px;
  background: #1e1e3a;
  color: #c0c0d0;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.mobile-pad button:active { background: #00d2a0; color: #0f0f23; }
.mobile-pad .up    { grid-area: up; }
.mobile-pad .down  { grid-area: down; }
.mobile-pad .left  { grid-area: left; }
.mobile-pad .right { grid-area: right; }
@media (max-width: 500px) {
  .mobile-pad { display: grid; }
  .controls button { padding: 8px 18px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score-panel">
      <div>得分 <strong id="score">0</strong></div>
      <div>最高 <strong id="best">0</strong></div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button id="btn-restart">重新开始</button>
    <button id="btn-pause">暂停</button>
  </div>
  <div class="mobile-pad" id="mobile-pad">
    <button class="up">▲</button>
    <button class="left">◀</button>
    <button class="right">▶</button>
    <button class="down">▼</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const btnRestart = document.getElementById("btn-restart");
const btnPause = document.getElementById("btn-pause");

const GRID = 20;
const COLS = 20;
const ROWS = 20;
const SIZE = GRID * COLS;
canvas.width = SIZE;
canvas.height = SIZE;

let snake, food, dir, nextDir, score, best, speed, gameLoop, paused, gameOver;
const INITIAL_SPEED = 120;

function loadBest() {
  const v = parseInt(localStorage.getItem("snake_best"), 10);
  return isNaN(v) ? 0 : v;
}
function saveBest(v) {
  localStorage.setItem("snake_best", v);
}

function init() {
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx, y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  best = loadBest();
  speed = INITIAL_SPEED;
  paused = false;
  gameOver = false;
  scoreEl.textContent = "0";
  bestEl.textContent = best;
  btnPause.textContent = "暂停";
  spawnFood();
}

function spawnFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const free = [];
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    }
  }
  if (free.length === 0) return;
  food = free[Math.floor(Math.random() * free.length)];
}

function step() {
  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return endGame();
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest(best);
    }
    spawnFood();
    if (speed > 60) {
      speed -= 2;
      clearInterval(gameLoop);
      gameLoop = setInterval(step, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoop);
  draw();
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  // grid lines (subtle)
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, SIZE);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * GRID);
    ctx.lineTo(SIZE, i * GRID);
    ctx.stroke();
  }

  // food
  const fx = food.x * GRID + GRID / 2;
  const fy = food.y * GRID + GRID / 2;
  ctx.fillStyle = "#ff4757";
  ctx.shadowColor = "#ff4757";
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(fx, fy, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((seg, i) => {
    const sx = seg.x * GRID;
    const sy = seg.y * GRID;
    const pad = 1;
    if (i === 0) {
      ctx.fillStyle = "#00d2a0";
      ctx.shadowColor = "#00d2a0";
      ctx.shadowBlur = 12;
    } else {
      const t = i / Math.max(snake.length - 1, 1);
      const r = Math.round(0 + t * 20);
      const g = Math.round(210 - t * 40);
      const b = Math.round(160 - t * 80);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // eyes
  if (snake.length > 0) {
    const h = snake[0];
    const ex = h.x * GRID + GRID / 2;
    const ey = h.y * GRID + GRID / 2;
    const offsets = [
      { dx: -3.5, dy: -3.5 },
      { dx: 3.5, dy: -3.5 },
    ];
    if (dir.x === -1) { offsets[0] = { dx: -1.5, dy: -3.5 }; offsets[1] = { dx: -1.5, dy: 3.5 }; }
    if (dir.x === 1)  { offsets[0] = { dx: 5.5, dy: -3.5 }; offsets[1] = { dx: 5.5, dy: 3.5 }; }
    if (dir.y === -1) { offsets[0] = { dx: -3.5, dy: -1.5 }; offsets[1] = { dx: 3.5, dy: -1.5 }; }
    if (dir.y === 1)  { offsets[0] = { dx: -3.5, dy: 5.5 }; offsets[1] = { dx: 3.5, dy: 5.5 }; }

    ctx.fillStyle = "#fff";
    offsets.forEach(o => {
      ctx.beginPath();
      ctx.arc(ex + o.dx, ey + o.dy, 2.8, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = "#111";
    offsets.forEach(o => {
      ctx.beginPath();
      ctx.arc(ex + o.dx, ey + o.dy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // overlay
  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = "#ff4757";
    ctx.font = "bold 28px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("游戏结束", SIZE / 2, SIZE / 2 - 10);
    ctx.fillStyle = "#c0c0d0";
    ctx.font = "15px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("点击「重新开始」继续", SIZE / 2, SIZE / 2 + 24);
  } else if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = "#00d2a0";
    ctx.font = "bold 28px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("已暂停", SIZE / 2, SIZE / 2);
  }
}

function start() {
  clearInterval(gameLoop);
  gameLoop = setInterval(step, speed);
}

function togglePause() {
  if (gameOver) return;
  if (paused) {
    paused = false;
    btnPause.textContent = "暂停";
    start();
  } else {
    paused = true;
    btnPause.textContent = "继续";
    clearInterval(gameLoop);
    draw();
  }
}

function restart() {
  clearInterval(gameLoop);
  init();
  start();
  draw();
}

function changeDir(dx, dy) {
  if (gameOver || paused) return;
  if (dx !== 0 && dir.x === -dx) return;
  if (dy !== 0 && dir.y === -dy) return;
  nextDir = { x: dx, y: dy };
}

document.addEventListener("keydown", e => {
  switch (e.key) {
    case "ArrowUp": case "w": case "W": e.preventDefault(); changeDir(0, -1); break;
    case "ArrowDown": case "s": case "S": e.preventDefault(); changeDir(0, 1); break;
    case "ArrowLeft": case "a": case "A": e.preventDefault(); changeDir(-1, 0); break;
    case "ArrowRight": case "d": case "D": e.preventDefault(); changeDir(1, 0); break;
    case " ": e.preventDefault(); togglePause(); break;
  }
});

btnPause.addEventListener("click", togglePause);
btnRestart.addEventListener("click", restart);

document.querySelectorAll(".mobile-pad button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.classList.contains("up")) changeDir(0, -1);
    if (btn.classList.contains("down")) changeDir(0, 1);
    if (btn.classList.contains("left")) changeDir(-1, 0);
    if (btn.classList.contains("right")) changeDir(1, 0);
  });
  btn.addEventListener("touchstart", e => {
    e.preventDefault();
    if (btn.classList.contains("up")) changeDir(0, -1);
    if (btn.classList.contains("down")) changeDir(0, 1);
    if (btn.classList.contains("left")) changeDir(-1, 0);
    if (btn.classList.contains("right")) changeDir(1, 0);
  });
});

init();
start();
draw();
</script>
</body>
</html>
